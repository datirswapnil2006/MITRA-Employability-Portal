version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:latest
    container_name: mitra_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: mitra_employability
    volumes:
      - mongo_data:/data/db

  # Node.js Express Backend Service
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mitra_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/mitra_employability
      - JWT_SECRET=mitra_production_secret_key_change_me
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongodb

  # React Frontend Service
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: mitra_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo_data:
